name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - run: bun run build
      - name: Assert no .ts import specifiers in dist/**/*.d.ts
        run: |
          if grep -rnE "from ['\"].*\.ts['\"]" dist/; then
            echo "Found .ts import specifier in dist/"
            exit 1
          fi
