<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>venus-webgpu — Phase 1 Compute MVP</title>
    <style>
      body {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        max-width: 820px;
        margin: 2rem auto;
        padding: 0 1rem;
        background: #0d1117;
        color: #c9d1d9;
      }
      button {
        background: #238636;
        color: #fff;
        border: 0;
        padding: 0.6rem 1.2rem;
        border-radius: 6px;
        font-size: 1rem;
        cursor: pointer;
      }
      pre {
        background: #161b22;
        padding: 1rem;
        border-radius: 6px;
        overflow-x: auto;
        border: 1px solid #30363d;
      }
      .ok { color: #3fb950; }
      .err { color: #f85149; }
    </style>
  </head>
  <body>
    <h1>venus-webgpu: Phase 1 Compute MVP</h1>
    <p>
      Encodes a real Venus (virtio-gpu Vulkan) command stream for <code>N = 4096</code> float32 vector
      addition, translates SPIR-V → WGSL via <code>naga-wasm</code>, and executes on WebGPU.
    </p>
    <button id="run">Run Venus Compute Demo</button>
    <pre id="out">Click "Run Venus Compute Demo" to start...</pre>
    <script type="module" src="./dist/demo.js"></script>
  </body>
</html>
