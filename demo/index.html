<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>venus-webgpu — Compute &amp; 3D Graphics Demo</title>
    <style>
      body {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        max-width: 820px;
        margin: 2rem auto;
        padding: 0 1rem;
        background: #0d1117;
        color: #c9d1d9;
      }
      button {
        background: #238636;
        color: #fff;
        border: 0;
        padding: 0.6rem 1.2rem;
        border-radius: 6px;
        font-size: 1rem;
        cursor: pointer;
      }
      pre {
        background: #161b22;
        padding: 1rem;
        border-radius: 6px;
        overflow-x: auto;
        border: 1px solid #30363d;
      }
      .ok { color: #3fb950; }
      .err { color: #f85149; }
    </style>
  </head>
  <body>
    <h1>venus-webgpu: Compute &amp; 3D Graphics</h1>
    <p>
      Encodes real Venus (virtio-gpu Vulkan) command streams, translates SPIR-V → WGSL via
      <code>naga-wasm</code>, and executes on WebGPU.
    </p>
    <div style="display:flex;gap:0.75rem;margin-bottom:1rem;">
      <button id="run">Run Venus Compute Demo</button>
      <button id="run-cube">Run 3D Cube Demo</button>
    </div>
    <canvas id="cube-canvas" width="400" height="400" style="display:block;border:1px solid #30363d;border-radius:6px;margin-bottom:1rem;background:#010409;"></canvas>
    <pre id="out">Click a button to start...</pre>
    <script type="module" src="./dist/demo.js"></script>
  </body>
</html>
